<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>DepthWizard</title>
    <style>
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        place-items: center;
        background: #121a1b;
        color: #e8efe2;
        font: 15px 'Segoe UI', system-ui, sans-serif;
      }
      .card {
        text-align: center;
      }
      .spinner {
        width: 28px;
        height: 28px;
        margin: 0 auto 14px;
        border: 3px solid #3a4a40;
        border-top-color: #9bc58a;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      small {
        display: block;
        margin-top: 6px;
        color: #8fa390;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="spinner"></div>
      <div>Starting DepthWizard…</div>
      <small id="state">Loading the depth model on this computer</small>
    </div>
    <script>
      // The backend (started by the desktop shell) serves the viewer; open it once it answers.
      const BACKEND = 'http://127.0.0.1:8765';
      const SLOW_START_S = 120; // first start without a GPU can take a few minutes
      const started = Date.now();
      async function poll() {
        try {
          const response = await fetch(`${BACKEND}/api/health`);
          if (response.ok) {
            location.replace(`${BACKEND}/`);
            return;
          }
        } catch {
          /* not up yet */
        }
        const seconds = Math.round((Date.now() - started) / 1000);
        document.getElementById('state').textContent =
          seconds < SLOW_START_S
            ? `Loading the depth model on this computer (${seconds} s)`
            : 'Still starting. Without a GPU the first start can take a few minutes.';
        setTimeout(poll, 1000);
      }
      poll();
    </script>
  </body>
</html>
